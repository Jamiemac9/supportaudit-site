<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:'Schibsted Grotesk';font-weight:500;src:url('../../docs/assets/fonts/schibsted-grotesk-latin-500-normal.woff2')}@font-face{font-family:'Schibsted Grotesk';font-weight:700;src:url('../../docs/assets/fonts/schibsted-grotesk-latin-700-normal.woff2')}</style>
<style>
body{margin:0;width:1200px;height:630px;background:#0A1A2F;font-family:'Schibsted Grotesk',sans-serif;color:#fff;position:relative;overflow:hidden}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.5px);background-size:9px 9px;-webkit-mask-image:linear-gradient(115deg,transparent 40%,#000 85%)}
.in{position:absolute;inset:72px;display:flex;flex-direction:column;justify-content:space-between}
.logo{display:flex;align-items:center;gap:18px;font-size:34px;font-weight:700;letter-spacing:-.02em}
.mk{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:44px;height:44px}.mk i{border-radius:4px}
h1{margin:0;font-size:76px;line-height:1;letter-spacing:-.04em;font-weight:700;max-width:960px}
h1 span{color:#D4F25A}
p{margin:0;font-size:28px;color:#B3BFCB;letter-spacing:-.01em}
.chips{display:flex;gap:12px}.chips b{padding:10px 18px;border-radius:999px;font-size:22px}
</style></head><body><div class="dots"></div>
<div class="in">
<div class="logo"><span class="mk"><i style="background:#E3B341"></i><i style="background:#2F9E6B"></i><i style="background:#E8892F"></i><i style="background:#D64545"></i></span>Support Audit</div>
<h1>Resident support files that stand up to <span>scrutiny.</span></h1>
<div style="display:flex;justify-content:space-between;align-items:end"><p>Independent audits for supported housing in England</p>
<div class="chips"><b style="background:rgba(227,179,65,.2);color:#F2C964">Gold</b><b style="background:rgba(47,158,107,.22);color:#62D69E">Green</b><b style="background:rgba(232,137,47,.22);color:#FFB36B">Amber</b><b style="background:rgba(214,69,69,.22);color:#FF8A8A">Red</b></div></div>
</div></body></html>
